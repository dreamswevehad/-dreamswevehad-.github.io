<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dreams We've Had</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --text: #EDE7DE;
      --dim: #8A8480;
      --accent: #B08D57;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Open Sans', sans-serif;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      align-content: flex-start;
      justify-content: space-between;
      gap: 1rem;
      min-height: 100vh;
      padding: 64px 48px 48px 48px;
      position: relative;
    }

    main {
      text-align: left;
      opacity: 0;
      animation: fadeIn 1.4s ease-out forwards;
    }

    .home-visual {
      display: block;
      max-width: min(90vw, 780px);
      width: 100%;
      height: auto;
      opacity: 0;
      animation: fadeIn 1.4s ease-out forwards;
      animation-delay: 0.2s;
    }

    @media (min-width: 900px) {
      .home-visual {
        position: absolute;
        top: 150px;
        left: 360px;
        max-width: min(58vw, 1100px);
      }
    }

    h1 {
      font-family: 'Open Sans', sans-serif;
      font-weight: 300;
      font-size: clamp(1.3rem, 3.5vw, 2rem);
      letter-spacing: 0.16em;
      margin: 0 0 2.4rem 0;
      line-height: 1.15;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }

    nav a {
      color: var(--dim);
      text-decoration: none;
      font-weight: 300;
      font-size: clamp(1.3rem, 3.5vw, 2rem);
      letter-spacing: 0.16em;
      transition: color 0.25s ease;
    }

    nav a:focus-visible {
      color: #C9C4BE;
    }

    @media (hover: hover) {
      nav a:hover {
        color: #C9C4BE;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main,
      .home-visual {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Dreams We've Had</h1>
    <nav>
      <a href="shop/">Vinyl</a>
      <a href="lyrics/">Lyrics</a>
      <a href="contact/">Contact</a>
    </nav>
  </main>
  <img class="home-visual" src="images/home-visual.png" alt="何よりもまず、神の国と神の義を求めなさい。そうすれば、これらのものはみな加えて与えられる。">
</body>
</html>
