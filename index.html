<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dreams We've Had</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #131113;
      --text: #EDE7DE;
      --dim: #8A8480;
      --accent: #B08D57;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Open Sans', sans-serif;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      align-content: flex-start;
      justify-content: space-between;
      gap: 1.75rem;
      min-height: 100vh;
      padding: 64px 48px 48px 48px;
      position: relative;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: url('images/everything-and-you-bg.jpg');
      background-size: cover;
      background-position: center;
    }

    .page-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(19, 17, 19, 0.6);
    }

    main {
      text-align: left;
      opacity: 0;
      animation: fadeIn 1.4s ease-out forwards;
    }

    .home-visual-wrap {
      display: contents;
    }

    .home-visual {
      display: block;
      max-width: min(90vw, 780px);
      width: 100%;
      height: auto;
      opacity: 0;
      animation: fadeIn 1.4s ease-out forwards;
      animation-delay: 0.2s;
    }

    @media (min-width: 900px) {
      .home-visual {
        position: absolute;
        top: 64px;
        left: 384px;
        max-width: min(58vw, 1100px);
      }
    }

    .home-divider-h {
      display: block;
      width: min(80vw, 700px);
      height: 1px;
      background: var(--dim);
      opacity: 0;
      border: none;
      margin: 0;
      animation: fadeIn 1.4s ease-out forwards;
      animation-delay: 0.1s;
    }

    .home-divider-v {
      display: none;
    }

    @media (min-width: 900px) {
      .home-divider-h {
        display: none;
      }

      .home-divider-v {
        display: block;
        position: absolute;
        top: 64px;
        left: 336px;
        width: 1px;
        background: var(--dim);
        opacity: 0;
        animation: fadeIn 1.4s ease-out forwards;
        animation-delay: 0.1s;
      }
    }

    .home-title {
      display: block;
      width: clamp(150px, 20vw, 240px);
      height: auto;
      margin: 0 0 48px 0;
      opacity: 0;
      animation: fadeIn 1.4s ease-out forwards;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }

    nav a {
      color: var(--dim);
      text-decoration: none;
      font-weight: 300;
      font-size: clamp(1.3rem, 3.5vw, 2rem);
      letter-spacing: 0.16em;
      transition: color 0.25s ease;
    }

    nav a:focus-visible {
      color: #C9C4BE;
    }

    @media (hover: hover) {
      nav a:hover {
        color: #C9C4BE;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main,
      .home-title,
      .home-visual,
      .home-divider-h,
      .home-divider-v {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="page-bg"></div>
  <main>
    <img class="home-title" src="images/home-title.png" alt="Dreams We've Had">
    <nav>
      <a href="shop/">Vinyl</a>
      <a href="lyrics/">Lyrics</a>
      <a href="contact/">Contact</a>
    </nav>
  </main>
  <hr class="home-divider-h">
  <div class="home-visual-wrap">
    <div class="home-divider-v" id="home-divider-v"></div>
    <img class="home-visual" id="home-visual" src="images/home-visual.png" alt="何よりもまず、神の国と神の義を求めなさい。そうすれば、これらのものはみな加えて与えられる。">
  </div>
  <script>
    (function () {
      var img = document.getElementById('home-visual');
      var line = document.getElementById('home-divider-v');

      function syncLineHeight() {
        line.style.height = img.offsetHeight + 'px';
      }

      if (img.complete) {
        syncLineHeight();
      } else {
        img.addEventListener('load', syncLineHeight);
      }
      window.addEventListener('resize', syncLineHeight);
    })();
  </script>
</body>
</html>
