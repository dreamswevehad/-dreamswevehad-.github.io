<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lyrics — Dreams We've Had</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #131113;
      --text: #EDE7DE;
      --dim: #8A8480;
      --accent: #B08D57;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Open Sans', sans-serif;
      font-weight: 300;
      letter-spacing: 0.16em;
      min-height: 100vh;
      padding: 64px 24px 64px 48px;
    }

    h1 {
      font-family: 'Open Sans', sans-serif;
      font-weight: 300;
      letter-spacing: 0.16em;
      line-height: 1.3;
      margin: 0 0 1.6rem 0;
      font-size: clamp(1.1rem, 2.8vw, 1.6rem);
    }

    .albums {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      margin-top: 1.6rem;
    }

    .album-cover-link {
      display: block;
      width: 200px;
      text-decoration: none;
      color: inherit;
    }

    .album-cover-link img {
      width: 100%;
      display: block;
      opacity: 0.9;
      transition: opacity 0.25s ease;
    }

    .album-cover-link:hover img,
    .album-cover-link:focus-visible img {
      opacity: 1;
    }

    .album-cover-link .album-title {
      display: block;
      margin-top: 0.8rem;
      font-size: 1rem;
      font-style: italic;
      color: var(--dim);
    }
  </style>
</head>
<body>
  <h1>Lyrics</h1>
  <div class="albums">
    <a class="album-cover-link" href="everything-and-you/">
      <img src="../images/everything-and-you-cover.jpg" alt="Everything And You album cover">
      <span class="album-title">Everything And You (2019)</span>
    </a>
  </div>
</body>
</html>
